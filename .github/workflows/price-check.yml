name: Price & Stock Check

on:
  schedule:
    # Runs every 6 hours. Adjust the cron expression to check more/less often.
    - cron: '0 */6 * * *'
  workflow_dispatch: # allows manually triggering a run from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run price/stock check
        run: node src/index.js check --config config.json

      - name: Commit updated history
        run: |
          git config user.name "price-monitor-bot"
          git config user.email "[email protected]"
          git add data/history.json
          git diff --staged --quiet || git commit -m "Update price/stock history [automated]"
          git push
